<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Camera body -->
  <rect x="10" y="32" width="80" height="56" rx="10" ry="10" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round"/>
  <!-- Camera top raised section -->
  <rect x="33" y="20" width="34" height="14" rx="4" ry="4" fill="none" stroke="white" stroke-width="6"/>
  <!-- Lens outer -->
  <circle cx="50" cy="60" r="18" fill="none" stroke="white" stroke-width="6"/>
  <!-- Lens inner -->
  <circle cx="50" cy="60" r="8" fill="none" stroke="white" stroke-width="4"/>
  <!-- Lens highlight -->
  <circle cx="45" cy="55" r="3.5" fill="white"/>
  <!-- Flash -->
  <circle cx="72" cy="45" r="4" fill="none" stroke="white" stroke-width="3.5"/>
</svg>
